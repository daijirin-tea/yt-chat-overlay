<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット欄</title>
    <style>
        @keyframes chat_item_animation {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
        body {
            font-size: calc(var(--font_size) * 1vw);
            --font_size: 1.5;
            --chat_item_left_width: 2.5;
            --chat_item_margin: 1;
            --chat_item_right_id_size: 0.8;
            --chats_bottom: 10;
            --chats_right: 10;
        }
        #chats {
            position: absolute;
            bottom: calc(1px * var(--chats_bottom));
            right: calc(1px * var(--chats_right));
            user-select: none;
            display: flex;
            overflow: hidden;
        }
        #chats.column {
            flex-direction: column;
        }
        #chats.row {
            flex-direction: row;
        }
        #chats.drop_shadow .chat_item {
            box-shadow: rgb(0,0,0,0.3) 0 0 7px 0;
        }
        .chat_item {
            background-color: white;
            width: 12em;
            border-radius: 0.5em;
            display: flex;
            padding: 0.5em;
            margin: 0.5em;
            line-break: anywhere;
            animation: chat_item_animation 0.2s;
        }
        #chats.column {
            min-height: 2em;
        }
        #chats.row .chat_item {
            width: max-content;
        }
        .chat_item p {
            margin: 0;
        }
        .chat_item_left {
            width: calc(1em * var(--chat_item_left_width));
            height: 100%;
        }
        .chat_item_left_icon {
            width: 100%;
            border-radius: 100%;
        }
        .chat_item_right {
            width: calc(100% - calc(1em * var(--chat_item_left_width)) - calc(1em * var(--chat_item_margin)));
            height: 100%;
            margin-left: calc(1em * var(--chat_item_margin));
        }
        .chat_item_right_id {
            font-size: calc(1em * var(--chat_item_right_id_size));
        }
        .chat_item_right_content img {
            width: 1em;
            vertical-align: middle;
        }
        .chat_item_right_id_owner {
            color: #c3ba11;
        }
        .chat_item_right_id_mod {
            color: #065fd4;
        }
        .chat_item_right_id_member {
            color: #107516;
        }

        @property --scale {
            initial-value: 0;
            syntax: "<number>";
            inherits: true;
        }
        @property --additional_rotate {
            initial-value: 0;
            syntax: "<number>";
            inherits: true;
        }
        @property --additional_top_ratio {
            initial-value: 0;
            syntax: "<number>";
            inherits: true;
        }
        @keyframes effects_type_0_display {
            0% {
                --scale: 0;
                --additional_rotate: 0;
                opacity: 0;
            }
            80% {
                --scale: 1;
                --additional_rotate: 10;
                opacity: 1;
            }
            100% {
                --scale: 0;
                opacity: 0;
            }
        }
        @keyframes effects_type_3_display {
            0% {
                --additional_rotate: 0;
            }
            16% {
                --additional_rotate: 25;
            }
            48% {
                --additional_rotate: -25;
            }
            80% {
                --additional_rotate: 25;
            }
            100% {
                --additional_rptate: 0;
                opacity: 0;
            }
        }
        @keyframes effects_type_4_display {
            0% {
                --scale: 0;
                --additional_top_ratio: 1;
            }
            30%,50% {
                --scale: 1;
                --additional_rotate: calc(5 * var(--direction));
                --additional_top_ratio: 0;
                opacity: 1;
            }
            100% {
                --scale: 0;
                --additional_top_ratio: 1;
            }
        }
        @keyframes effects_type_6_display {
            0% {
                --additional_top_ratio: 0;
            }
            25% {
                --additional_top_ratio: 1;
            }
            50% {
                --additional_top_ratio: 0;
            }
            75% {
                --additional_top_ratio: 1;
            }
            100% {
                --additional_top_ratio: 0;
            }
        }
        #effects_div {
            pointer-events: none;
            user-select: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .effects_type_0 {
            position: absolute;
            top: calc(var(--top) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%)rotate(calc((var(--rotate) + var(--additional_rotate)) * 1deg))scale(var(--scale));
            animation: effects_type_0_display 1.5s ease forwards;
        }
        .effects_type_1, .effects_type_2 {
            position: absolute;
            top: calc(var(--top) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%)rotate(calc((var(--rotate) + var(--additional_rotate)) * 1deg));
        }
        .effects_type_3 {
            position: absolute;
            top: calc(var(--top) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%)rotate(calc((var(--rotate) + var(--additional_rotate)) * 1deg));
            animation: effects_type_3_display 1.5s ease forwards;
        }
        .effects_type_4 {
            position: absolute;
            top: calc((var(--top) + var(--additional_top_ratio) * var(--additional_top)) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%)rotate(calc((var(--rotate) + var(--additional_rotate)) * 1deg));
            animation: effects_type_4_display 1.5s ease forwards;
        }
        .effects_type_5 {
            position: absolute;
            top: calc(var(--top) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%);
        }
        .effects_type_6 {
            position: absolute;
            top: calc((var(--top) + var(--additional_top_ratio) * var(--additional_top)) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%);
            animation: effects_type_6_display 8s ease forwards;
        }
        .effects_type_7 {
            position: absolute;
            top: calc(var(--top) * 1px);
            left: calc(var(--left) * 1px);
            width: calc(20vw);
            transform: translate(-50%,-50%);
        }

        #context_menu {
            --top: 0;
            --left: 0;
            --context_menu_size: 1.2vw;
            position: absolute;
            top: calc(1px * var(--top));
            left: calc(1px * var(--left));
            font-size: var(--context_menu_size);
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            background-color: white;
            border-radius: 0.5em;
            box-shadow: rgb(0,0,0,0.3) 0 0 7px 0;
            overflow: hidden;
            transition: 0.2s opacity;
        }
        #context_menu:not(.selected) {
            opacity: 0;
            user-select: none;
            pointer-events: none;
        }
        .context_menu_element {
            text-align: center;
            margin: 0;
            padding: 0.5em 0;
        }
        .context_menu_element:not(:first-child) {
            border-top: rgb(203, 203, 203) 1px solid;
        }
        .context_menu_element:hover {
            background-color: rgb(203, 203, 203);
        }
        #context_menu_url {
            line-break: anywhere;
            display: inline-block;
            border: 1.5px solid white;
            background-color: rgb(203, 203, 203);
            padding: 0 0.5em;
            border-radius: 0.5em;
            width: 10em;
        }
        .context_menu_element button {
            background-color: white;
            border: 1.5px solid rgb(203, 203, 203);
            border-radius: 1em;
            padding: 0 0.5em;
            transition: 0.2s color,0.2s border-color;
        }
        .context_menu_element button:hover {
            border-color:  white;
            background-color: rgb(203, 203, 203);
        }
        .context_menu_element input, button {
            margin: 0 1em;
            font-size: var(--context_menu_size);
        }
        .context_menu_element input[type="number"],
        .context_menu_element input[type="text"] {
            width: 6em;
        }
        .context_menu_element input[type="checkbox"] {
            width: 1em;
            height: 1em;
        }
    </style>
</head>
<body>
    <div id="chats" class="column drop_shadow"></div>
    <div id="effects_div"></div>
    <div id="context_menu">
        <p class="context_menu_element">
            url:<button id="context_menu_url_copy">Copy</button>
        </p>
        <p class="context_menu_element">ビデオID<input type="text" value="" id="context_menu_video_id"></p>
        <p class="context_menu_element" id="context_menu_move">チャット欄をこの場所に移動</p>
        <p class="context_menu_element">縦向き表示<input type="checkbox" checked id="context_menu_column"></p>
        <p class="context_menu_element">相対フォントサイズ<input type="number" value="1.5" id="context_menu_size"></p>
        <p class="context_menu_element">相対IDフォントサイズ<input type="number" value="0.8" id="context_menu_id_size"></p>
        <p class="context_menu_element">アイコンサイズ<input type="number" value="2.5" id="context_menu_icon_size"></p>
        <p class="context_menu_element">ドロップシャドウ<input type="checkbox" checked id="context_menu_drop_shadow"></p>
        <p class="context_menu_element">イベントを使用<input type="checkbox" checked id="context_menu_events"></p>
    </div>
    <script src="defineElement.js"></script>
    <script src="apiKey.js"></script>
    <script src="emojiList.js"></script>
    <script src="messageToDom.js"></script>
    <script src="defineEvents.js"></script>
    <script src="main.js"></script>
    <script src="addChat.js"></script>
    <script src="contextMenu.js"></script>
</body>
</html>
